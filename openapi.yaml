openapi: 3.0.4
info:
  title: Lottery Numbers
  description: >-
    Lottery Numbers fetches winning lottery numbers, bonus balls, draw dates,
    and jackpot amounts for major games. Specify Powerball, Mega Millions,
    EuroMillions, or Lotto Max to receive draw results with prize totals, and on
    paid plans the next draw's estimate and number frequency statistics from the
    last 100 draws.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/lottery:
    get:
      summary: Lottery Numbers
      description: >-
        Lookup the latest winning lottery numbers for Powerball, Mega Millions,
        EuroMillions, or Lotto Max — pick the game with the numbers parameter.
        Optionally provide a date for historical results.
      operationId: lottery
      parameters:
        - name: numbers
          in: query
          schema:
            type: string
          required: true
          description: >-
            The lottery game to lookup: powerball, megamillions, euromillions,
            or lottomax
          example: powerball
        - name: date
          in: query
          schema:
            type: string
          required: false
          description: >-
            Optional date for historical lookup (YYYY-MM-DD). Returns the
            nearest draw to this date.
          example: '2024-01-15'
        - name: stats
          in: query
          schema:
            type: boolean
          required: false
          description: Include number frequency statistics over the last 100 draws
          example: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  drawDate: '2026-10-26'
                  numbers:
                    - 18
                    - 26
                    - 49
                    - 50
                    - 54
                    - 1
                  powerball: 1
                  jackpot: $691 Million
                  jackpotValue: 691000000
                  jackpotFormatted: $691 Million
                  lotteryType: powerball
                  nextDraw:
                    drawDate: '2026-10-28'
                    jackpot: $716 Million
                    jackpotValue: 716000000
                    jackpotFormatted: $716 Million
                    cashValue: $307.2 Million
                    cashValueValue: 307200000
                  stats:
                    drawsAnalyzed: 100
                    since: '2026-03-09'
                    hotNumbers:
                      - number: 42
                        timesDrawn: 13
                      - number: 3
                        timesDrawn: 12
                      - number: 64
                        timesDrawn: 12
                      - number: 4
                        timesDrawn: 11
                      - number: 14
                        timesDrawn: 11
                    coldNumbers:
                      - number: 1
                        timesDrawn: 3
                      - number: 34
                        timesDrawn: 3
                      - number: 39
                        timesDrawn: 3
                      - number: 62
                        timesDrawn: 3
                      - number: 20
                        timesDrawn: 4
                    hotBonusNumbers:
                      - number: 3
                        timesDrawn: 8
                      - number: 14
                        timesDrawn: 7
                      - number: 1
                        timesDrawn: 6
                    drawNumbers:
                      - number: 18
                        timesDrawn: 8
                        drawsSinceLast: 16
                      - number: 26
                        timesDrawn: 6
                        drawsSinceLast: 14
                      - number: 49
                        timesDrawn: 8
                        drawsSinceLast: 12
                      - number: 50
                        timesDrawn: 10
                        drawsSinceLast: 2
                      - number: 54
                        timesDrawn: 7
                        drawsSinceLast: 9
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
