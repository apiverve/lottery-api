openapi: 3.0.4
info:
  title: Lottery Numbers
  description: >-
    Lottery Numbers fetches winning lottery numbers, bonus balls, draw dates,
    and jackpot amounts for major games. Specify Powerball, Mega Millions,
    EuroMillions, or Lotto Max to receive draw results with prize totals.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/lottery:
    get:
      summary: Lottery Numbers
      description: >-
        Lookup the latest winning lottery numbers for Powerball, Mega Millions,
        EuroMillions, or Lotto Max — pick the game with the numbers parameter.
        Optionally provide a date for historical results.
      operationId: lottery
      parameters:
        - name: numbers
          in: query
          schema:
            type: string
          required: true
          description: >-
            The lottery game to lookup: powerball, megamillions, euromillions,
            or lottomax
          example: powerball
        - name: date
          in: query
          schema:
            type: string
          required: false
          description: >-
            Optional date for historical lookup (YYYY-MM-DD). Returns the
            nearest draw to this date.
          example: '2024-01-15'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  lotteryType: megamillions
                  drawDate: '2026-02-04'
                  numbers:
                    - 10
                    - 50
                    - 55
                    - 58
                    - 59
                    - 5
                  megaBall: 5
                  jackpot: $70 Million
                  jackpotValue: 70000000
                  jackpotFormatted: $70 Million
                  nextDraw:
                    drawDate: '2026-02-07'
                    jackpot: $82 Million
                    jackpotValue: 82000000
                    cashValue: $37.2 Million
                    cashValueValue: 37200000
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
